    <title>Sotto Reads — dictation practice that goes quiet while you write</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sotto-theme');
          var forced = new URLSearchParams(window.location.search).get('theme');
          var theme =
            forced === 'light' || forced === 'dark'
              ? forced
              : stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
